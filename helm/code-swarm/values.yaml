# Default values for code-swarm Helm chart

replicaCount: 1

image:
  repository: ghcr.io/opensin-code/code-swarm
  pullPolicy: IfNotPresent
  tag: latest

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

# API Gateway Configuration
api_gateway:
  enabled: true
  replicas: 2
  service:
    type: LoadBalancer
    port: 8000
    grpcPort: 50051
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  env:
    RATE_LIMIT_RPS: "50"
    GRPC_PORT: "50051"
    TZ: "UTC"

# Agent Workers Configuration  
agent_workers:
  enabled: true
  replicas: 3
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage: 70
  agents:
    - name: sin-zeus
      model: fireworks-ai/minimax-m2.7
      replicas: 1
    - name: sin-solo
      model: vercel/deepseek-v4-pro
      replicas: 1
    - name: coder-sin-swarm
      model: fireworks-ai/minimax-m2.7
      replicas: 1

# Simone-MCP Configuration
simone_mcp:
  enabled: true
  replicas: 2
  service:
    type: ClusterIP
    port: 8234
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  config:
    bridge_mode: "local"
    health_check_interval: "30s"

# WebSocket Configuration
websocket:
  enabled: true
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Ingress Configuration
ingress:
  enabled: true
  className: istio
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/ingress.class: istio
  hosts:
    - host: code-swarm.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: code-swarm-tls
      hosts:
        - code-swarm.local

# Service Mesh (Istio) Configuration
istio:
  enabled: true
  mtls: true
  rate_limiting:
    enabled: true
    requests_per_second: 50

# Monitoring Configuration
monitoring:
  enabled: true
  prometheus:
    enabled: true
    scrape_interval: 15s
  grafana:
    enabled: true
    admin_password: prom-operator
  alerting:
    enabled: true
    alertmanager_url: http://alertmanager:9093

# Security Configuration
security:
  networkPolicies: true
  podSecurityPolicy: true
  rbac: true

# Data Persistence
persistence:
  enabled: true
  storage_class: default
  agents_data:
    size: 1Gi
    access_mode: ReadWriteOnce
  tasks_data:
    size: 2Gi
    access_mode: ReadWriteOnce
  metrics_data:
    size: 5Gi
    access_mode: ReadWriteOnce

# Node Selection
nodeSelector:
  kubernetes.io/os: linux

# Tolerations for Taints
tolerations:
  - key: "node.kubernetes.io/not-ready"
    operator: "Exists"
    effect: "NoSchedule"
    tolerationSeconds: 300
  - key: "node.kubernetes.io/unreachable"
    operator: "Exists"
    effect: "NoExecute"
    tolerationSeconds: 300

# Affinity rules
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app: code-swarm
          topologyKey: kubernetes.io/hostname