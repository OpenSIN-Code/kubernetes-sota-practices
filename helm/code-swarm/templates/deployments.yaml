    metadata:
      labels:
        {{- include "code-swarm.selectorLabels" . | nindent 8 }}
        component: websocket
    spec:
      containers:
        - name: websocket-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
