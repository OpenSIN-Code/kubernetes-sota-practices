{{- end }}

{{- define "code-swarm.websocket.service" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "code-swarm.fullname" . }}-websocket
  labels:
    {{- include "code-swarm.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8001
      targetPort: ws
      protocol: TCP
  selector:
    {{- include "code-swarm.selectorLabels" . | nindent 4 }}
